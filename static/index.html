  $('#dkdeck').innerHTML=v.dk?`<div class="tcw">${cardH(v.tc,'tr')}</div><div class="pile">${'<div class="cd back"></div>'.repeat(Math.min(3,v.dk))}<em>${v.dk}</em></div>`:`<div class="tsu ${cs_(v.ts)%3?'r':''}">${SU[v.ts]}</div>`;
  $('#dkdisc').innerHTML=v.ds?`<div class="pile">${'<div class="cd back"></div>'.repeat(Math.min(3,Math.ceil(v.ds/4)))}<em>${v.ds}</em></div>`:'';
  $('#dktable').innerHTML=v.tb.map((p,i)=>`<div class="pair" data-i="${i}">${cardH(p[0],tg_.includes(i)?'tgt':'')}${p[1]!=null?cardH(p[1],'dfn'):''}</div>`).join('');
  $('#dkme').innerHTML=v.h.map(c=>{let ok=false;if(v.win==null){if(att)ok=canAdd(v,c);else if(v.w===me)ok=tgts(v,c).length>0||!!canTr(v,c)}
   return cardH(c,(ok?'ok ':'dim ')+(G.dsel===c?'sel':''))}).join('');
  fan('#dkme',v.h.length);fan('#dkopp',v.o)});
 $('#dkact').innerHTML=v.win!=null?'':v.w===me?(!att?`<button class="btn" data-dk="take">✋ ${t('take')}</button>`+(G.dsel!=null&&canTr(v,G.dsel)?`<button class="btn go" data-dk="tr">↪ ${t('transfer')}</button>`:''):(v.tb.length&&(v.tk||!und(v).length)?`<button class="btn go" data-dk="done">${v.tk?t('done'):t('bita')}</button>`:'')):'';
 if(v.win!=null)G.w=v.win;G.dl=Date.now()+(m.left||40)*1000;clearInterval(G.iv);
 if(v.win==null)G.iv=setInterval(()=>{const f=Math.max(0,(G.dl-Date.now())/40000);const i=$('#dkt i');i.style.width=f*100+'%';i.style.background=v.w===me?(f<.25?'#f87171':'#4ade80'):'#94a3b8'},200);
 bars()}
function dkSend(a,c,i){S({t:'dmove',a,c,i})}
function dkTap(id){const v=G.dv;if(!v||v.win!=null)return;const me=G.seat;
 if(v.at===me){if(canAdd(v,id)){hap();dkSend('att',id)}return}
 if(v.w!==me)return;const tg_=tgts(v,id),tr=canTr(v,id);
 if(tg_.length===1&&!tr)return dkSend('def',id,tg_[0]);if(!tg_.length&&tr)return dkSend('tr',id);
 if(tg_.length||tr){G.dsel=G.dsel===id?null:id;renderDk({v,left:Math.max(1,(G.dl-Date.now())/1000)})}}
/* hodisalar */
on('[data-g]',x=>sheet(x.dataset.g));
on('[data-cur]',x=>{SH.cur=x.dataset.cur;SH.st=ST[SH.cur]?ST[SH.cur][0]:0;drawSheet()});
on('[data-st]',x=>{SH.st=+x.dataset.st;drawSheet()});
on('#go',goSearch);on('#cx',()=>{S({t:'cancel'});SH.q=0;drawSheet()});on('#sh',(x,e)=>{if(e.target===x)closeSheet()});
on('[data-v]',x=>show(x.dataset.v));
on('[data-d]',x=>{const[a,b]=x.dataset.d.split(':');S({t:'deposit',method:a,amount:+b})});
on('[data-rx]',x=>{if(G&&!G.bot)S({t:'chat',text:x.dataset.rx});else fly(x.dataset.rx,true)});
on('[data-lang]',x=>{lang=localStorage.lang=x.dataset.lang;document.documentElement.lang=lang;drawGames();drawMe();drawNav('me');chips()});
on('#snw',()=>{SNOW=!SNOW;localStorage.snow=SNOW?1:0;drawMe()});
on('#snd',()=>{SND=!SND;localStorage.snd=SND?1:0;drawMe();beep()});
on('#cp',x=>{try{navigator.clipboard.writeText(x.dataset.l)}catch(e){}toast(t('copied'))});
on('#shr',x=>{const u='https://t.me/share/url?url='+encodeURIComponent(x.dataset.l);tg&&tg.openTelegramLink?tg.openTelegramLink(u):window.open(u)});
on('#rs',()=>{if(G&&!G.over)ask(t('resign')+'?',ok=>{if(!ok||!G)return;if(G.bot&&!G.dk){G.over=1;showRes('lose','')}else{G.w=1-G.seat;S({t:'leave'})}})});
on('#rok',()=>{endTable();show('games')});
on('#again',()=>{const q=LASTQ||{},bg=G&&G.bot&&!G.dk;endTable();show('games');if(!q.g)return;if(bg)return startLocal(q.g);sheet(q.g);SH.cur=q.cur;SH.st=q.st;drawSheet();goSearch()});
on('[data-dk]',x=>{const a=x.dataset.dk;if(a==='tr')dkSend('tr',G.dsel);else dkSend(a)});
$('#board').addEventListener('click',ev=>{const x=ev.target.closest('.cell');if(x)tap(+x.dataset.r,+x.dataset.c)});
$('#dkme').addEventListener('click',ev=>{const x=ev.target.closest('.cd');if(x)dkTap(+x.dataset.id)});
$('#dktable').addEventListener('click',ev=>{const x=ev.target.closest('.pair');if(!x||G.dsel==null)return;const i=+x.dataset.i;if(tgts(G.dv,G.dsel).includes(i)){const c=G.dsel;G.dsel=null;dkSend('def',c,i)}});
/* qor */
let SNOW=localStorage.snow!=='0';
(function(){const cv=$('#snow'),cx=cv.getContext('2d');let W,H,F=[],dpr=Math.min(devicePixelRatio||1,2);
 const rs=()=>{W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr};rs();addEventListener('resize',rs);
 const mk=y=>({x:Math.random()*W,y:y??Math.random()*H,r:(.6+Math.random()*1.9)*dpr,v:(.25+Math.random()*.8)*dpr,d:Math.random()*6.28,o:.25+Math.random()*.55});
 for(let i=0;i<46;i++)F.push(mk());
 (function f(){requestAnimationFrame(f);cx.clearRect(0,0,W,H);if(!SNOW||document.hidden||$('#table').classList.contains('on'))return;
  for(const s of F){s.y+=s.v;s.d+=.012;s.x+=Math.sin(s.d)*.35*dpr;if(s.y>H+4)Object.assign(s,mk(-4));
   cx.beginPath();cx.fillStyle='rgba(255,255,255,'+s.o+')';cx.shadowColor='#fff';cx.shadowBlur=s.r*3;cx.arc(s.x,s.y,s.r,0,6.28);cx.fill()}})();
})();
drawGames();drawNav('games');chips();connect();
